name: CI

# Runs the hardware-independent checks on every code push / PR. The recording
# pipeline's smokes (WGC capture, NVENC/encoder, real audio devices, a visible
# window) CANNOT run on a hosted runner — there's no GPU, no audio endpoint and
# no display — so those stay manual on a Windows development machine. This gate
# catches the regressions a runner CAN see: syntax, undefined names, import
# failures, vulnerable dependencies, and hardware-independent behavior.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Windows runner: Momento is Windows-only (PyQt6 + win32 ctypes + WGC +
    # PyAudioWPatch all assume Windows), so imports must be exercised there.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen   # no display on the runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"   # pyproject pins >=3.12,<3.13
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -c constraints-release.txt -e .[dev]

      - name: Lint (ruff — pyflakes + syntax)
        run: ruff check momento tests scripts --select F,E9

      - name: Byte-compile
        run: python -m compileall -q momento tests scripts

      - name: Import check
        run: python -c "import momento.__main__, momento.core.recorder, momento.core.session, momento.core.audio_devices, momento.ui.editor, momento.ui.settings_dialog, momento.ui.toast; print('imports OK')"

      - name: Pure-logic tests
        run: |
          python tests/smoke_config_robustness.py
          python tests/smoke_settings_save.py
          python tests/smoke_worker_lifecycle.py
          python tests/smoke_capture_safety.py
          python tests/smoke_log_privacy.py
          python tests/smoke_pyav_runtime_contract.py --unit-only
          python tests/smoke_editor_live_recording.py
          python tests/smoke_bookmarks.py
          python tests/smoke_audio_resync.py
          python tests/smoke_audio_stall.py
          python tests/smoke_audio_downmix.py
          python tests/smoke_encoder_audio_guard.py
          python tests/smoke_recording_failures.py
          python tests/smoke_window_retry.py
          python tests/smoke_repair_lock.py
          python tests/smoke_uploader_resume.py
          python tests/smoke_upload_cancel.py
          python tests/smoke_youtube_thumbnail.py
          python tests/smoke_youtube_client_config.py
          python tests/smoke_youtube_auth_config.py
          python tests/smoke_youtube_setup.py
          python tests/smoke_youtube_auth_async.py
          python tests/smoke_youtube_avatar.py
          python tests/smoke_timeline_trim.py
          python tests/smoke_trim_lifecycle.py
          python tests/smoke_fullscreen_blocklist.py
          python tests/smoke_preview_prime.py
          python tests/smoke_storage_migration.py
          python tests/smoke_first_run.py
          python tests/smoke_welcome_setup.py
          python tests/smoke_installer_contract.py
          python tests/smoke_update_metadata.py
          python tests/smoke_update_client.py
          python tests/smoke_update_attempts.py
          python tests/smoke_update_lifecycle.py
          python tests/smoke_update_service.py
          python tests/smoke_update_handoff.py
          python tests/smoke_update_runtime.py
          python tests/smoke_update_release_tools.py
          python tests/smoke_encoder_portability.py
          python tests/smoke_public_release.py
          python tests/smoke_git_history_privacy.py
          python tests/smoke_single_instance.py
          python tests/smoke_release_environment.py
          python tests/smoke_corresponding_source.py

      - name: Dependency CVE audit
        run: pip-audit --local

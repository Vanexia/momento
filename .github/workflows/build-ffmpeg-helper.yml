name: Build minimal FFmpeg helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Verify reviewed toolchain
        run: |
          gcc --version | head -n 1 | grep '16.2.0'
          nasm -v | grep '3.02'
          pacman -Q > toolchain-packages.txt

      - name: Build helper
        run: scripts/build_ffmpeg_helper.sh build/ffmpeg-helper dist/ffmpeg-helper

      - name: Verify helper contract
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          python tests/check_ffmpeg.py dist/ffmpeg-helper
          python tests/smoke_ffmpeg_helper.py dist/ffmpeg-helper
          if ((Get-FileHash dist/ffmpeg-helper/ffmpeg.exe -Algorithm SHA256).Hash -ne "A53993C4FBFBC3FA9ED201AE03502F053182699B3580C7523DC66D176D0371FC") { throw "ffmpeg.exe differs from the reviewed release" }
          if ((Get-FileHash dist/ffmpeg-helper/ffprobe.exe -Algorithm SHA256).Hash -ne "DD7364CD03D86CB5F91FD028174CB6D5F1B2F3BA2606095676E0596B216A4D4D") { throw "ffprobe.exe differs from the reviewed release" }
          python scripts/package_ffmpeg_helper.py dist/ffmpeg-helper dist/Momento-ffmpeg-helper-8.1.2-1.zip
          if ((Get-FileHash dist/Momento-ffmpeg-helper-8.1.2-1.zip -Algorithm SHA256).Hash -ne "BB8E4FC7A4E8E3BB5EA4F509BFA49E01BAD1932F8CD1E4399D145D90C080F0B5") { throw "helper archive differs from the reviewed release" }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Momento-FFmpeg-helper-8.1.2-1
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Momento-ffmpeg-helper-8.1.2-1.zip
            toolchain-packages.txt
